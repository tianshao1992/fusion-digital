limit_req_zone $binary_remote_addr zone=fusiondigital_analytics:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=fusiondigital_analytics_report:10m rate=10r/m;

upstream fusiondigital_analytics_collector {
    server 127.0.0.1:3101;
    keepalive 4;
}

upstream fusiondigital_node {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name "";
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name fusiondigital.club www.fusiondigital.club;
    server_tokens off;

    # These markers are rendered into an explicit TLS/HTTP2 block whenever a
    # managed certificate is present. Keeping TLS rendering deterministic
    # prevents a later release from overwriting Certbot's live configuration.
    # FUSIONDIGITAL_TLS_BEGIN
    # FUSIONDIGITAL_TLS_END

    root /srv/fusiondigital/current/dist/client;
    client_max_body_size 2m;

    # Browser assets are compressed losslessly. Prebuilt .gz sidecars are used
    # first, with runtime gzip retained as a safe fallback for small omissions.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/javascript application/json application/manifest+json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cloudflare/Sites-only facilities are not present on this standalone
    # public mirror. Fail closed instead of forwarding identity or write APIs.
    location = /signin-with-chatgpt { return 404; }
    location = /signout-with-chatgpt { return 404; }
    location = /callback { return 404; }
    location = /api/account { return 404; }
    location ^~ /api/account/ { return 404; }
    location = /api/research { return 404; }
    location ^~ /api/research/ { return 404; }
    location = /admin/analytics { return 404; }
    location ^~ /admin/analytics/ { return 404; }

    # This exact endpoint never reaches the application Node process, D1 or
    # identity code. Nginx applies the public rate/body limits, suppresses its
    # access log, and passes only Origin, Content-Type and the bounded body to a
    # dedicated loopback collector. Client x-fd headers, cookies, referrer,
    # User-Agent and network identity are never forwarded to that process.
    location = /api/analytics/events {
        if ($request_method != POST) { return 405; }
        client_max_body_size 4k;
        limit_req zone=fusiondigital_analytics burst=10 nodelay;
        limit_req_status 429;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_request_buffering on;
        proxy_set_header Host "fusiondigital-analytics-collector.local";
        proxy_set_header Connection "";
        proxy_set_header Origin $http_origin;
        proxy_set_header Content-Type $http_content_type;
        proxy_connect_timeout 1s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
        proxy_pass http://fusiondigital_analytics_collector;
    }

    # Sites calls this single endpoint only after its server-side admin role
    # check. The collector independently authenticates the service request and
    # response with a timestamped, nonce-bound HMAC. No browser identity or
    # network metadata is forwarded to the loopback process.
    location = /__fusiondigital_analytics_report_v1 {
        if ($scheme != https) { return 404; }
        if ($request_method != POST) { return 405; }
        client_max_body_size 2k;
        limit_req zone=fusiondigital_analytics_report burst=3 nodelay;
        limit_req_status 429;
        access_log off;
        gzip off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_set_header Host "fusiondigital-analytics-collector.local";
        proxy_set_header Connection "";
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header X-FD-Analytics-Report-Timestamp $http_x_fd_analytics_report_timestamp;
        proxy_set_header X-FD-Analytics-Report-Nonce $http_x_fd_analytics_report_nonce;
        proxy_set_header X-FD-Analytics-Report-Signature $http_x_fd_analytics_report_signature;
        proxy_connect_timeout 1s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
        proxy_pass http://fusiondigital_analytics_collector;
    }
    location = /api/analytics { return 404; }
    location ^~ /api/analytics/ { return 404; }
    location = /_vinext/image { return 404; }
    location ^~ /.vite/ { return 404; }

    # EXL-50U browser derivatives: expose only the four reviewed aliases.
    # The two GLB aliases are injected from the validated runtime lock below;
    # direct /models/exl50u-interactive/** access remains denied.
    location = /device-assets/exl50u-interactive/model-manifest.json {
        alias /srv/fusiondigital/current/dist/client/models/exl50u-interactive/model-manifest.json;
        types { }
        default_type application/json;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Disposition "inline" always;
        add_header Accept-Ranges "bytes" always;
    }

    location = /device-assets/exl50u-interactive/poster.webp {
        alias /srv/fusiondigital/current/dist/client/models/exl50u-interactive/poster.webp;
        types { }
        default_type image/webp;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Disposition "inline" always;
        add_header Accept-Ranges "bytes" always;
    }

    # The renderer replaces this marker pair with exact `location =` blocks
    # for every Git-managed or external GLB in the fully validated runtime
    # lock. A digest-shaped or renamed but unlocked file is never routable.
    # FUSIONDIGITAL_LOCKED_GLB_ROUTES_BEGIN
    # FUSIONDIGITAL_LOCKED_GLB_ROUTES_END

    # Exact aliases and lock-rendered routes above are the only
    # accepted device-asset namespaces. Unknown bundle paths fail closed.
    location /device-assets/ { return 404; }

    # EFIT v1/v2 public derivatives. Regexes restrict requests to one safe
    # filename component and the two reviewed directories.
    location ~ ^/device-data/(?<efit_json_dir>exl50u-efit(?:-v2)?)/(?<efit_json_file>[A-Za-z0-9._-]+\.json)$ {
        alias /srv/fusiondigital/current/dist/client/data/$efit_json_dir/$efit_json_file;
        types { }
        default_type application/json;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Disposition "inline" always;
        add_header Accept-Ranges "bytes" always;
    }

    location ~ ^/device-data/(?<efit_bin_dir>exl50u-efit)/(?<efit_bin_file>[A-Za-z0-9._-]+\.bin)$ {
        alias /srv/fusiondigital/current/dist/client/data/$efit_bin_dir/$efit_bin_file;
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Disposition "inline" always;
        add_header Accept-Ranges "bytes" always;
    }

    location ~ ^/device-data/(?<efit_gz_dir>exl50u-efit-v2)/(?<efit_gz_file>[A-Za-z0-9._-]+\.jsonl\.gz)$ {
        alias /srv/fusiondigital/current/dist/client/data/$efit_gz_dir/$efit_gz_file;
        gzip off;
        gzip_static off;
        types { }
        default_type application/gzip;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Disposition "inline" always;
        add_header Accept-Ranges "bytes" always;
    }

    location ~ ^/(?:device-)?data/exl50u-efit(?:-v2)?(?:/|$) {
        return 404;
    }

    # Preserve the Worker policy that prevents bypassing the reviewed aliases.
    location = /models/exl50u-interactive { return 404; }
    location ^~ /models/exl50u-interactive/ { return 404; }
    location = /models/iter-high-detail-v1 { return 404; }
    location ^~ /models/iter-high-detail-v1/ { return 404; }
    # The activated EXL-50U package publishes exactly two small metadata files.
    # Missing files stay 404 in metadata-only releases; GLBs remain accessible
    # only through the exact runtime-lock-rendered /device-assets locations.
    location = /models/exl50u-general-assembly-v1/model-manifest.json {
        alias /srv/fusiondigital/current/dist/client/models/exl50u-general-assembly-v1/model-manifest.json;
        gzip off;
        gzip_static off;
        types { }
        default_type application/json;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Disposition "inline" always;
        add_header Accept-Ranges "bytes" always;
    }
    location = /models/exl50u-general-assembly-v1/PUBLICATION-NOTICE.md {
        alias /srv/fusiondigital/current/dist/client/models/exl50u-general-assembly-v1/PUBLICATION-NOTICE.md;
        gzip off;
        gzip_static off;
        types { }
        default_type text/markdown;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Disposition "inline" always;
        add_header Accept-Ranges "bytes" always;
    }
    location = /models/exl50u-general-assembly-v1 { return 404; }
    location ~ "^/models/exl50u-general-assembly-v1/.+\.glb$" { return 404; }
    # Exact lock-rendered device-asset locations win before regex matching.
    # Any copied anonymous derivative under another static path stays private.
    location ~ "(?:^|/)(?:device\.preview\.[a-f0-9]{64}\.meshopt|anonymous-shard-(?:0[1-9]|1[0-9]|20)\.[a-f0-9]{64}\.high\.meshopt)\.glb$" { return 404; }

    # Serve large public files with Nginx so Range requests do not consume the
    # Node heap. Dynamic pages and APIs continue to vinext.
    location ^~ /assets/ {
        try_files $uri =404;
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # GLB is intentionally absent. Every public GLB must have a lock-rendered
    # exact location.
    location ~* \.glb$ { return 404; }

    location ~* ^/(?:data|figures|licenses|models)/.+\.(?:json|csv|bib|png|jpg|jpeg|webp|avif|svg|step|txt|bin|gz)$ {
        try_files $uri =404;
        expires 1h;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* ^/[A-Za-z0-9._-]+\.(?:svg|png|webp|avif|ico|pdf|docx|csv|bib|json)$ {
        try_files $uri =404;
        expires 1h;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # These headers are trusted only when Sites injects them. The public
        # mirror must remove even client-forged values at its ingress boundary.
        proxy_set_header oai-authenticated-user-id "";
        proxy_set_header oai-authenticated-user-email "";
        proxy_set_header oai-authenticated-user-full-name "";
        proxy_set_header oai-authenticated-user-full-name-encoding "";
        proxy_set_header X-FD-Analytics-Report-Timestamp "";
        proxy_set_header X-FD-Analytics-Report-Nonce "";
        proxy_set_header X-FD-Analytics-Report-Signature "";
        proxy_hide_header oai-authenticated-user-id;
        proxy_hide_header oai-authenticated-user-email;
        proxy_hide_header oai-authenticated-user-full-name;
        proxy_hide_header oai-authenticated-user-full-name-encoding;
        proxy_hide_header X-FD-Analytics-Report-Timestamp;
        proxy_hide_header X-FD-Analytics-Report-Nonce;
        proxy_hide_header X-FD-Analytics-Report-Signature;

        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_pass http://fusiondigital_node;
    }
}
