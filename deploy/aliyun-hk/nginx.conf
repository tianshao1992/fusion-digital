upstream fusiondigital_node {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name fusiondigital.club www.fusiondigital.club;
    server_tokens off;

    root /srv/fusiondigital/current/dist/client;
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cloudflare/Sites-only facilities are not present on this standalone
    # public mirror. Fail closed instead of forwarding identity or write APIs.
    location = /signin-with-chatgpt { return 404; }
    location = /signout-with-chatgpt { return 404; }
    location = /callback { return 404; }
    location = /api/account { return 404; }
    location ^~ /api/account/ { return 404; }
    location = /api/research { return 404; }
    location ^~ /api/research/ { return 404; }
    location = /_vinext/image { return 404; }
    location ^~ /.vite/ { return 404; }

    # EXL-50U browser derivatives: expose only the four reviewed aliases.
    # Direct /models/exl50u-interactive/** access remains denied below.
    location = /device-assets/exl50u-interactive/model-manifest.json {
        alias /srv/fusiondigital/current/dist/client/models/exl50u-interactive/model-manifest.json;
        types { }
        default_type application/json;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Disposition "inline" always;
        add_header Accept-Ranges "bytes" always;
    }

    location = /device-assets/exl50u-interactive/exl50u-interactive.glb {
        alias /srv/fusiondigital/current/dist/client/models/exl50u-interactive/exl50u-interactive.glb;
        types { }
        default_type model/gltf-binary;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Disposition "inline" always;
        add_header Accept-Ranges "bytes" always;
    }

    location = /device-assets/exl50u-interactive/exl50u-interactive-high.meshopt.glb {
        alias /srv/fusiondigital/current/dist/client/models/exl50u-interactive/exl50u-interactive-high.meshopt.glb;
        types { }
        default_type model/gltf-binary;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Disposition "inline" always;
        add_header Accept-Ranges "bytes" always;
    }

    location = /device-assets/exl50u-interactive/poster.webp {
        alias /srv/fusiondigital/current/dist/client/models/exl50u-interactive/poster.webp;
        types { }
        default_type image/webp;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Disposition "inline" always;
        add_header Accept-Ranges "bytes" always;
    }

    # The high-detail ITER bundle is hydrated before the build and served
    # locally. The content-addressed filename contract prevents path choice by
    # clients and removes the runtime dependency on GitHub Releases.
    location ~ "^/device-assets/iter-high-detail/v1/([a-z0-9-]+\.[a-f0-9]{64}\.high\.meshopt\.glb)$" {
        alias /srv/fusiondigital/current/dist/client/models/iter-high-detail-v1/$1;
        types { }
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Disposition "inline" always;
        add_header Accept-Ranges "bytes" always;
    }

    # Exact aliases above and the ITER digest route are the only accepted
    # device-asset namespaces.
    location /device-assets/ { return 404; }

    # EFIT v1/v2 public derivatives. Regexes restrict requests to one safe
    # filename component and the two reviewed directories.
    location ~ ^/(?:device-)?data/(exl50u-efit(?:-v2)?)/([A-Za-z0-9._-]+\.json)$ {
        alias /srv/fusiondigital/current/dist/client/data/$1/$2;
        types { }
        default_type application/json;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Disposition "inline" always;
        add_header Accept-Ranges "bytes" always;
    }

    location ~ ^/(?:device-)?data/(exl50u-efit(?:-v2)?)/([A-Za-z0-9._-]+\.bin)$ {
        alias /srv/fusiondigital/current/dist/client/data/$1/$2;
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Disposition "inline" always;
        add_header Accept-Ranges "bytes" always;
    }

    location ~ ^/(?:device-)?data/(exl50u-efit-v2)/([A-Za-z0-9._-]+\.jsonl\.gz)$ {
        alias /srv/fusiondigital/current/dist/client/data/$1/$2;
        gzip off;
        types { }
        default_type application/gzip;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Disposition "inline" always;
        add_header Accept-Ranges "bytes" always;
    }

    location ~ ^/(?:device-)?data/exl50u-efit(?:-v2)?(?:/|$) {
        return 404;
    }

    # Preserve the Worker policy that prevents bypassing the reviewed aliases.
    location = /models/exl50u-interactive { return 404; }
    location ^~ /models/exl50u-interactive/ { return 404; }
    location = /models/iter-high-detail-v1 { return 404; }
    location ^~ /models/iter-high-detail-v1/ { return 404; }

    # Serve large public files with Nginx so Range requests do not consume the
    # Node heap. Dynamic pages and APIs continue to vinext.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* ^/(?:data|figures|licenses|models)/.+\.(?:json|csv|bib|png|jpg|jpeg|webp|avif|svg|glb|step|txt|bin|gz)$ {
        try_files $uri =404;
        expires 1h;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* ^/[A-Za-z0-9._-]+\.(?:svg|png|webp|avif|ico|pdf|docx|csv|bib|json)$ {
        try_files $uri =404;
        expires 1h;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # These headers are trusted only when Sites injects them. The public
        # mirror must remove even client-forged values at its ingress boundary.
        proxy_set_header oai-authenticated-user-id "";
        proxy_set_header oai-authenticated-user-email "";
        proxy_set_header oai-authenticated-user-full-name "";
        proxy_set_header oai-authenticated-user-full-name-encoding "";
        proxy_hide_header oai-authenticated-user-id;
        proxy_hide_header oai-authenticated-user-email;
        proxy_hide_header oai-authenticated-user-full-name;
        proxy_hide_header oai-authenticated-user-full-name-encoding;

        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_pass http://fusiondigital_node;
    }
}
